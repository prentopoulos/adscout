# Planned production target for the SAME personal owner. This is not a deployed or approved release.
# Region/model/contracts/retention/service targets and runtime test evidence must be resolved.
schema_version: '0.3'
metadata:
  use_case_id: inventory-planning-assistant
  name: Inventory Planning Assistant
  version: 0.1.0
  owner: project-owner
  cost_center: null
  environment: prod
  project_group: personal-projects
business:
  intent: Explain inventory availability and forecast shortages using authoritative
    stock and demand data.
  users:
  - project-owner
  success_measures:
  - Reduce time to investigate a potential stock shortage.
  - Produce accurate, useful recommendations with source timestamps.
  non_goals:
  - Place purchase orders or update inventory records.
  - Treat forecast demand as guaranteed future demand.
architecture:
  cloud: other
  region: null
  runtime: hosted_service_to_select
  language: python
  framework: custom
  framework_version: null
  iac: null
  l1_pattern_ref: null
  l2_pattern_ref: null
model:
  provider: null
  model_id: null
  approval_ref: null
  fallback_model_id: null
  access_route: choose-local-or-hosted-model
data:
  classification: confidential
  residency: null
  pii_expected: false
  retention_days: null
  sources:
  - id: inventory-status
    kind: operational_api
    contract_ref: null
    owner: project-owner
    freshness_limit_seconds: 300
    access_scope: project-owned-inventory
  - id: demand-forecast
    kind: forecast_api
    contract_ref: null
    owner: project-owner
    freshness_limit_seconds: 300
    access_scope: project-owned-inventory
agent:
  pattern: single_agent
  grounding:
    mode: structured_tools
    source_ids:
    - inventory-status
    - demand-forecast
    vector_store_ref: null
    citations_required: true
  memory:
    mode: session
    store_ref: null
    cross_session_enabled: false
    retention_days: null
  tools:
  - id: get_inventory_status
    capability: Read on-hand and reserved stock for an item and location.
    operation: read
    catalog_ref: null
    contract_ref: null
  - id: get_demand_forecast
    capability: Read forecast additional demand for the same item, location and horizon.
    operation: read
    catalog_ref: null
    contract_ref: null
  - id: compare_inventory_options
    capability: Calculate stock shortage scenarios deterministically; advisory only.
    operation: read
    catalog_ref: null
    contract_ref: null
  human_approval:
    operational_changes: out_of_scope
    approver_role: project-owner
