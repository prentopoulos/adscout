# Synthetic segment for tests and the offline demo. Every company is on a reserved domain.
schema_version: "2"
segment_id: synthetic-demo
name: Synthetic demo segment
scope: Fictional companies on reserved test domains, for exercising every pipeline path.
regions: ["US", "CA"]
categories:
  - peripherals
size_range:
  metric: employees
  min: 50
  max: null
exclusions:
  domains: ["excluded.test"]
  categories: []
score_threshold: 60
near_miss_min: 55
criteria:
  - id: audience
    name: Audience fit
    question: How closely do the brand's buyers match a gaming publisher's readers?
    weight: 0.35
    fields: [categories, recent_launches, social_accounts]
    anchors:
      1: Not aimed at gamers.
      2: Mostly a general audience.
      3: A gaming line beside other business.
      4: Gaming is a main line.
      5: Gaming hardware first.
  - id: ad_activity
    name: Advertising activity
    question: Does the brand buy advertising or sponsorships today?
    weight: 0.30
    fields: [ad_signals, sponsorships]
    anchors:
      1: No ad tags or sponsorships.
      2: Analytics tags only.
      3: One ad pixel or one sponsorship.
      4: Several ad pixels or sponsorships.
      5: Several ad pixels and current sponsorships.
  - id: budget_capacity
    name: Budget capacity
    question: How large is the brand?
    weight: 0.20
    fields: [employee_count, revenue_usd, ownership, parent]
    anchors:
      1: 50 to 99 employees.
      2: 100 to 249 employees.
      3: 250 to 999 employees.
      4: 1,000 to 4,999 employees.
      5: 5,000 or more employees.
  - id: recent_launches
    name: Recent launches
    question: Has the brand launched products recently?
    weight: 0.15
    fields: [recent_launches]
    anchors:
      1: No launch in 12 months.
      2: One minor refresh.
      3: One notable launch.
      4: Several launches.
      5: A major launch in 6 months.
