[project]
name = "adscout"
version = "0.1.0"
description = "Advertiser prospecting and qualification agent (portfolio project)"
requires-python = ">=3.13"
authors = [{ name = "Peter Rentopoulos" }]
# No licence until the publishing gate (PROJECT.md §6); PyPI rejects "Private ::" uploads.
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
adscout = "adscout.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"

[tool.ruff]
line-length = 100
target-version = "py313"
# Python only: Markdown (skills, verbatim copies, specs) is never reformatted.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "TID", "SIM", "RUF"]

[tool.ruff.lint.isort]
# scripts/ and tests/ are on pytest's pythonpath, so these import as top-level modules.
known-first-party = ["adscout", "checks", "conftest", "evals", "gate"]

[tool.ruff.lint.per-file-ignores]
# Tests assert and run git, uv and the CLI as subprocesses with fixed arguments.
"tests/**" = ["S101", "S603", "S607"]
"evals/**" = ["S101", "S603", "S607"]
# The gate and its checks run git, uv and openspec with fixed arguments.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "scripts", "evals"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]
addopts = ["--disable-socket", "--strict-markers", "-ra"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
